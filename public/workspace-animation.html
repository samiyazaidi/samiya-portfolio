<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>After Hours — Interactive Workspace</title>
<style>
  :root{color-scheme:dark;--navy:#061628;--navy2:#10263b;--wine:#511725;--burgundy:#79283d;--red:#a84f5d;--rose:#c87983;--blush:#e4b0aa;--ivory:#fff7ef;--cream:#f4e7da;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 10%,#3e2930 0,#17131b 55%,#080d15 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ivory)}
  .frame{width:min(1280px,100%);}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 12px;padding:0 4px;color:#dbc2b9;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .topline .note{letter-spacing:.03em;text-transform:none;color:#bfa8a5;font-size:12px}
  .scene{position:relative;width:100%;aspect-ratio:5/3;overflow:hidden;border-radius:22px;background:#271f29;box-shadow:0 36px 90px #0008,0 0 0 1px #b87b8130;isolation:isolate}
  svg{width:100%;height:100%;display:block}
  .hit{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;border-radius:18px;padding:0;outline-offset:4px}
  .hit:focus-visible{outline:2px solid #ffe6d5;box-shadow:0 0 0 5px #a84f5d88}
  .lamp-hit{left:61%;top:0;width:14%;height:25%}
  .curtain-hit{left:5%;top:5%;width:37%;height:51%}
  .prompt{pointer-events:none;user-select:none}
  #lamp-prompt, #curtain-prompt{transition:opacity .3s ease}
  #lamp-prompt .hint-arrow,#curtain-prompt .hint-arrow{animation:hint 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes hint{0%,100%{opacity:.64;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  #lamp-glow,#desk-light,#wall-light,#window-light{transition:opacity .9s ease}
  #curtains-left,#curtains-right{transition:transform 1.15s cubic-bezier(.2,.75,.18,1)}
  #curtains-left.open{transform:translateX(-235px)}
  #curtains-right.open{transform:translateX(235px)}
  #character-sit,#character-walk,#character-exit{opacity:0;pointer-events:none}
  #character-walk.entering{opacity:1;animation:walkIn 1.75s cubic-bezier(.2,.7,.25,1) forwards}
  #character-walk.leaving{opacity:1;animation:walkOut 1.5s cubic-bezier(.5,0,.8,.3) forwards}
  #character-sit.visible{opacity:1;transition:opacity .45s ease}
  #character-sit.hiding{opacity:0;transition:opacity .24s ease}
  @keyframes walkIn{0%{transform:translateX(-420px);opacity:0}12%{opacity:1}74%{transform:translateX(10px)}86%{transform:translateX(-7px)}100%{transform:translateX(0);opacity:1}}
  @keyframes walkOut{0%{transform:translateX(0);opacity:1}12%{transform:translateX(6px);opacity:1}100%{transform:translateX(-670px);opacity:0}}
  #character-walk .swing{transform-box:fill-box;transform-origin:top center;animation:legSwing .34s ease-in-out infinite alternate}
  #character-walk .swing.reverse{animation-delay:-.34s}
  #character-walk.entering .bob{animation:bob .34s ease-in-out infinite alternate}
  @keyframes legSwing{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  #bird{opacity:0;transform:translate(220px,-155px);transform-box:fill-box;transform-origin:center}
  #bird.flying-in{opacity:1;animation:birdIn 1.6s cubic-bezier(.22,.65,.25,1) forwards}
  #bird.perched{opacity:1;transform:translate(0,0);transition:transform .35s ease}
  #bird.flying-out{opacity:1;animation:birdOut 1.1s ease-in forwards}
  @keyframes birdIn{0%{transform:translate(220px,-155px) scale(.7);opacity:0}18%{opacity:1}70%{transform:translate(-12px,12px) scale(1.04)}100%{transform:translate(0,0) scale(1);opacity:1}}
  @keyframes birdOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(235px,-175px) scale(.72);opacity:0}}
  #bird .wing{transform-box:fill-box;transform-origin:center;animation:wing 0.22s ease-in-out infinite alternate}
  @keyframes wing{from{transform:rotate(-22deg)}to{transform:rotate(25deg)}}
  #bird.perched .wing{animation:none;transform:rotate(0)}
  @keyframes floatZ{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-7px);opacity:1}}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .control{display:flex;align-items:center;gap:8px;background:#21161f;border:1px solid #9d697455;color:#f9e9e0;border-radius:999px;padding:10px 15px;font-size:12px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
  .control:hover{background:#46232e;border-color:#c87983;transform:translateY(-1px)}
  .control[aria-pressed="true"]{background:#5e2134;border-color:#d38d96}
  .control:focus-visible{outline:2px solid #fff0d7;outline-offset:3px}
  .control .dot{width:8px;height:8px;border-radius:50%;background:#8f6066;box-shadow:0 0 0 3px #8f606622}
  .control[aria-pressed="true"] .dot{background:#ffdca0;box-shadow:0 0 10px #ffdca0}
  .state-line{text-align:center;color:#bda7a5;font-size:11px;margin:10px 0 0;min-height:16px}
  @media(max-width:700px){body{padding:10px}.topline{font-size:10px}.topline .note{display:none}.scene{border-radius:12px}.controls{gap:6px}.control{padding:8px 11px;font-size:11px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

        <!-- lamp hanging from ceiling -->
        <path d="M800 0V97" stroke="#1b1118" stroke-width="5"/><path d="M755 113Q762 75 800 72Q838 75 845 113Q800 140 755 113Z" fill="url(#lampShade)" stroke="#29161d" stroke-width="2"/><path d="M757 113Q800 130 843 113" fill="none" stroke="#ac6169" stroke-width="3"/>
        <circle id="bulb" cx="800" cy="125" r="11" fill="#69434a"/><circle id="bulbHalo" cx="800" cy="125" r="23" fill="#ffe9ae" opacity="0"/>
        <!-- prompts -->
        <g id="curtain-prompt" class="prompt">
          <path class="hint-arrow" d="M160 170H432M173 158L160 170L173 182M419 158L432 170L419 182" stroke="#f4dcce" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="hint-arrow" d="M297 126V148M286 138L297 149L308 138" stroke="#fff0df" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="296" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#fff7ef">Open the <tspan fill="#c87983" font-style="italic">curtains</tspan></text>
          <text x="296" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#f4e7da">to let in some daylight</text>
          <circle cx="448" cy="245" r="13" fill="#ef9f73"/><path d="M448 225V220M448 270V265M428 245H423M473 245H468M434 231L430 227M462 259L466 263M462 231L466 227M434 259L430 263" stroke="#ef9f73" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g id="lamp-prompt" class="prompt">
          <path class="hint-arrow" d="M874 193Q906 165 947 151M930 150L947 151L943 168" stroke="#f4dcce" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M941 133L946 146L959 151L946 156L941 169L936 156L923 151L936 146Z" fill="#ca7781"/>
          <text id="lamp-copy-1" x="1007" y="263" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#fff7ef">Switch on</text>
          <text id="lamp-copy-2" x="1007" y="307" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-style="italic" fill="#df8d96">the lights</text>
          <text id="lamp-copy-3" x="1007" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#f4dfd5">to start working…</text>
          <path d="M952 378L956 387L965 391L956 395L952 404L948 395L939 391L948 387Z" fill="#e6b5ad"/>
        </g>
      </g>
    </svg>
    <button class="hit lamp-hit" id="lamp-hit" aria-label="Switch on the lights to start working" title="Switch the lamp on or off" aria-pressed="false"></button>
    <button class="hit curtain-hit" id="curtain-hit" aria-label="Open the curtains to let in daylight" title="Open or close the curtains" aria-pressed="false"></button>
  </main>
  <div class="controls">
    <button class="control" id="lamp-control" aria-pressed="false"><span class="dot"></span><span id="lamp-control-text">Switch on lights</span></button>
    <button class="control" id="curtain-control" aria-pressed="false"><span class="dot"></span><span id="curtain-control-text">Open curtains</span></button>
    <button class="control" id="reset-control"><span aria-hidden="true">↺</span> Reset scene</button>
  </div>
  <p class="state-line" id="state-line" role="status" aria-live="polite">It’s quiet after hours. Switch on the lamp to begin.</p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const left = $('curtains-left'), right = $('curtains-right');
  const bird = $('bird'), night = $('night-overlay');
  const character = $('character-sit');
  const walking = document.createElementNS('http://www.w3.org/2000/svg','g');
  walking.setAttribute('id','character-walk');
  walking.innerHTML = `
    <g class="bob">
      <path d="M402 349Q428 320 469 326Q509 330 537 361L562 448H369L374 391Z" fill="url(#sweater)" stroke="#e5d3c3" stroke-width="1.5"/>
      <path d="M414 318C397 294 406 257 432 237C456 218 489 226 508 249C528 276 521 307 498 328C491 341 504 360 522 381C540 402 542 425 527 444C507 437 489 420 476 402C461 382 448 363 431 347C420 336 416 327 414 318Z" fill="url(#hijab)" stroke="#71313e" stroke-width="2"/>
      <path d="M414 318C396 291 406 256 432 237C456 218 489 226 508 249C528 276 521 307 498 328C477 346 452 350 433 336C422 328 417 323 414 318Z" fill="url(#hijabLight)" stroke="#914551" stroke-width="1.5"/>
      <path d="M423 257C442 248 454 231 461 226M421 273C444 261 466 239 474 229M424 291C450 276 476 255 484 240" stroke="#e6a4a5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M404 426Q423 438 442 430L456 485L432 486L410 449Z" fill="#f4e7da" stroke="#d8bba8" stroke-width="2"/>
      <path class="swing" d="M455 438Q468 452 470 478L463 526H442L446 477Z" fill="#f4e7da" stroke="#d8bba8" stroke-width="2"/>
      <path class="swing reverse" d="M477 438Q490 452 496 477L508 523H487L471 481Z" fill="#e5d0c0" stroke="#d8bba8" stroke-width="2"/>
      <path d="M441 526H465M487 523H511" stroke="#3a232a" stroke-width="9" stroke-linecap="round"/>
    </g>`;
  // Walking pose sits in the same scene layer, behind desk foreground objects.
  const svg = document.querySelector('svg');
  svg.insertBefore(walking, $('coffee-cup'));
  let lampOn = false, curtainsOpen = false, womanPresent = false, transitioning = false;
  let exitTimer = null, enterTimer = null, birdTimer = null;

  function setLampVisual(on) {
    lampOn = on;
    $('lamp-hit').setAttribute('aria-pressed', String(on));
    $('lamp-hit').setAttribute('aria-label', on ? 'Switch off the lights' : 'Switch on the lights to start working');
    $('lamp-control').setAttribute('aria-pressed', String(on));
    $('lamp-control-text').textContent = on ? 'Switch off lights' : 'Switch on lights';
    $('bulb').setAttribute('fill', on ? '#fff5d4' : '#69434a');
    $('bulbHalo').style.opacity = on ? '.65' : '0';
    $('wall-light').style.opacity = on ? '.86' : '0';
    $('desk-light').style.opacity = on ? '.8' : '0';
    const darkness = on ? (curtainsOpen ? '.02' : '.17') : (curtainsOpen ? '.39' : '.68');
    night.style.opacity = darkness;
    $('lamp-copy-1').textContent = on ? 'All done?' : 'Switch on';
    $('lamp-copy-2').textContent = on ? 'time to rest' : 'the lights';
    $('lamp-copy-3').textContent = on ? 'switch off to call it a day…' : 'to start working…';
    $('lamp-prompt').style.opacity = on ? '.98' : '1';
  }

  function setCurtainsVisual(open) {
    curtainsOpen = open;
    left.classList.toggle('open', open);
    right.classList.toggle('open', open);
    $('curtain-hit').setAttribute('aria-pressed', String(open));
    $('curtain-hit').setAttribute('aria-label', open ? 'Close the curtains' : 'Open the curtains to let in daylight');
    $('curtain-control').setAttribute('aria-pressed', String(open));
    $('curtain-control-text').textContent = open ? 'Close curtains' : 'Open curtains';
    $('window-light').style.opacity = open ? (lampOn ? '.4' : '.95') : '0';
    night.style.opacity = lampOn ? (open ? '.02' : '.17') : (open ? '.39' : '.68');
    $('state-line').textContent = open ? 'Daylight is coming in. A little visitor is on its way.' : (lampOn ? 'The room is lit and ready for work.' : 'It’s quiet after hours. Switch on the lamp to begin.');
    if (open) flyBirdIn(); else flyBirdOut();
  }

  function flyBirdIn() {
    clearTimeout(birdTimer);
    bird.classList.remove('flying-out','perched','flying-in');
    // Restart the flight animation so each opening is discoverable.
    void bird.getBoundingClientRect();
    bird.classList.add('flying-in');
    birdTimer = setTimeout(() => {
      if (curtainsOpen) {
        bird.classList.remove('flying-in');
        bird.classList.add('perched');
      }
    }, 1650);
  }

  function flyBirdOut() {
    clearTimeout(birdTimer);
    if (!bird.classList.contains('perched') && !bird.classList.contains('flying-in')) return;
    bird.classList.remove('perched','flying-in');
    void bird.getBoundingClientRect();
    bird.classList.add('flying-out');
    birdTimer = setTimeout(() => bird.classList.remove('flying-out'), 1150);
  }

  function characterEnter() {
    clearTimeout(exitTimer); clearTimeout(enterTimer);
    transitioning = true; womanPresent = true;
    character.classList.remove('visible','hiding');
    walking.classList.remove('leaving','entering');
    void walking.getBoundingClientRect();
    walking.classList.add('entering');
    $('state-line').textContent = 'She’s taking her seat. The workspace is waking up.';
    enterTimer = setTimeout(() => {
      walking.classList.remove('entering');
      walking.style.opacity = '0';
      character.classList.add('visible');
      transitioning = false;
      $('state-line').textContent = 'Lights on. Time to build something meaningful.';
    }, 1760);
  }

  function characterExit() {
    clearTimeout(enterTimer); clearTimeout(exitTimer);
    if (!womanPresent) return;
    transitioning = true;
    character.classList.remove('visible');
    character.classList.add('hiding');
    walking.style.opacity = '1';
    walking.classList.remove('entering','leaving');
    void walking.getBoundingClientRect();
    walking.classList.add('leaving');
    $('state-line').textContent = 'Wrapping up. She’s heading out for the night.';
    exitTimer = setTimeout(() => {
      walking.classList.remove('leaving');
      walking.style.opacity = '0';
      character.classList.remove('hiding');
      womanPresent = false; transitioning = false;
      $('state-line').textContent = curtainsOpen ? 'The room is quiet, with daylight at the window and a bird on the desk.' : 'The room is empty again. Switch on the lamp whenever you’re ready.';
    }, 1510);
  }

  function toggleCurtains() {
    if (!curtainsOpen) {
      setCurtainsVisual(true);
      return;
    }
    // Let the bird fly back out through the open window before closing the panels.
    flyBirdOut();
    window.setTimeout(() => setCurtainsVisual(false), 950);
  }

  function toggleLamp() {
    if (transitioning) return;
    if (!lampOn) {
      setLampVisual(true);
      characterEnter();
    } else {
      // Begin the character's exit while the light is still on; then darken the room.
      if (womanPresent) {
        transitioning = true;
        character.classList.remove('visible');
        character.classList.add('hiding');
        walking.style.opacity = '1';
        walking.classList.remove('entering','leaving');
        void walking.getBoundingClientRect();
        walking.classList.add('leaving');
        $('state-line').textContent = 'She’s finishing up and leaving the workspace.';
        exitTimer = setTimeout(() => {
          walking.classList.remove('leaving');
          walking.style.opacity = '0';
          character.classList.remove('hiding');
          womanPresent = false; transitioning = false;
          setLampVisual(false);
          $('state-line').textContent = curtainsOpen ? 'The room is dark and quiet, with daylight at the window.' : 'The room is empty again. Switch on the lamp whenever you’re ready.';
        }, 1510);
      } else {
        setLampVisual(false);
      }
    }
  }

  function resetScene() {
    clearTimeout(exitTimer); clearTimeout(enterTimer); clearTimeout(birdTimer);
    lampOn = false; curtainsOpen = false; womanPresent = false; transitioning = false;
    character.classList.remove('visible','hiding');
    walking.classList.remove('entering','leaving'); walking.style.opacity = '0';
    bird.classList.remove('flying-in','flying-out','perched'); bird.style.opacity = '0';
    setCurtainsVisual(false); setLampVisual(false);
    $('state-line').textContent = 'It’s quiet after hours. Switch on the lamp to begin.';
  }

  $('lamp-hit').addEventListener('click', toggleLamp);
  $('lamp-control').addEventListener('click', toggleLamp);
  $('curtain-hit').addEventListener('click', toggleCurtains);
  $('curtain-control').addEventListener('click', toggleCurtains);
  $('reset-control').addEventListener('click', resetScene);
  resetScene();
})();
</script>
</body>
</html>
